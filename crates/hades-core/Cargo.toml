[package]
name = "hades-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library: config, DB client, graph engine, pipeline logic"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyperlocal.workspace = true
http.workspace = true
http-body-util.workspace = true
base64.workspace = true
futures.workspace = true
regex.workspace = true
moka.workspace = true
tonic.workspace = true
hades-proto.workspace = true
tower.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
chrono.workspace = true
urlencoding.workspace = true
url.workspace = true
tokio-util.workspace = true
rand.workspace = true

# Code analysis
rustpython-parser.workspace = true
syn.workspace = true
sha2.workspace = true
proc-macro2.workspace = true
clang.workspace = true
tree-sitter.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true

[features]
# The throwaway-database harness in `test_support`. Off by default, so it never
# reaches a release build; enabled through a dev-dependency by this crate's own
# tests and by hades-cli's.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
# Self dev-dependency so `tests/*.rs` can reach the feature-gated module. The
# alternative was a second copy of the harness in each consumer, which is what
# this replaces.
hades-core = { path = ".", features = ["test-support"] }
