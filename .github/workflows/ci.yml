name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so toolchain churn surfaces one release at a time rather than
    # arriving three releases deep in a single bump.
    - cron: "0 6 * * 1"

# Cancel in-flight runs of the same workflow on the same ref when a new
# commit lands. Avoids burning CI minutes on stale PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Without a block here every job inherits whatever the
# repository default is, which is more than a build gate needs, and the drift
# job hands its token to a third-party action.
permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags or branches. A tag can be moved
# and a branch moves by design, so `@v4` or `@master` lets upstream change what
# runs here without any change landing in this repository. The trailing comment
# records which ref each SHA came from, so a bump stays readable in review.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: build / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml is the single source of truth for the compiler.
      # Pinning it while the action still asks for `@stable` left the pin
      # holding only by rustup's file-over-default precedence: the action would
      # install and default to a newer stable, rustup would quietly override it
      # per-command, and anything setting RUSTUP_TOOLCHAIN would restore the
      # drift with nothing to say so. Read the pin and install exactly it.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned to $channel"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, takes a `toolchain` input
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # The gate should be able to prove which compiler judged the code.
      # Without this, a silent toolchain substitution looks exactly like a
      # passing run.
      - name: Assert the running compiler matches the pin
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version
          running=$(rustc --version | cut -d' ' -f2)
          expected="${{ steps.toolchain.outputs.channel }}"
          if [ "$running" != "$expected" ]; then
            echo "::error::rustc is $running but rust-toolchain.toml pins $expected"
            exit 1
          fi

      # hades-proto pulls in prost-build via tonic-build, which shells out
      # to `protoc` at build time. Workstations typically have protobuf-compiler
      # installed system-wide; CI runners don't.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Isolated operational script contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: cargo build
        run: cargo build --workspace --verbose

      # Library and binary unit tests. Database fixtures run strictly in the
      # separate resource-limited server job below.
      - name: cargo test --lib --bins
        run: cargo test --workspace --lib --bins --verbose

      # Explicit service-free targets; analyzer/CUDA probes remain opt-in.
      - name: cargo test (service-free tests/ targets)
        run: |
          cargo test -p hades-proto --test proto_types --verbose
          cargo test -p hades-core --test pipeline --verbose
          cargo test -p hades-core --test config_integration --verbose
          cargo test -p hades-core --test embedding_contract --test embedding_client --test extraction_client --test training_client --verbose

  python-contracts:
    name: Python CPU contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: services/requirements-ci.txt
      - name: Install hashed CPU test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --extra-index-url https://download.pytorch.org/whl/cpu -r services/requirements-ci.txt
      - name: Generate protobuf contracts and run CPU tests
        run: |
          python -c "import torch; assert torch.version.cuda is None"
          make -C services proto-gen PROTO_DIR=../proto PYTHON=python
          python -m pytest services/tests -v --junitxml=python-contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-contract-results
          path: python-contracts.xml

  database-contracts:
    name: Isolated database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch locked build dependencies and pinned server image
        run: |
          cargo fetch --locked
          docker pull "$(python3 -c "import runpy; print(runpy.run_path('scripts/test_isolated_database.py')['IMAGE'])")"
      - name: Strict disposable database contracts
        run: python3 scripts/test_isolated_database.py --docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-database-results
          path: |
            /tmp/hades-tests-*/*.log
            /tmp/hades-tests-*/results.json

  # The pin fixes the drift and removes the only mechanism that ever told this
  # repository a new toolchain wanted changes, which is how CI came to be red
  # from the first push and stayed that way. This job keeps that signal without
  # making stable a gate: it is allowed to fail, and its job is to keep the
  # bump one release wide instead of three.
  stable-drift:
    name: stable drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install current stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: What current stable would say
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustc --version
          echo "--- fmt ---"
          cargo fmt --all -- --check || echo "::warning::current stable reformats this tree"
          echo "--- clippy ---"
          cargo clippy --workspace --all-targets -- -D warnings \
            || echo "::warning::current stable has lints this tree does not satisfy"
